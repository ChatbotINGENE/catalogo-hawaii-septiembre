<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo Hawaii Preventa Septiembre 2026</title>
<meta name="description" content="Preventa de Septiembre 2026 de Almacén Hawaii, Centro Histórico de San Salvador. Flores, follajes, macetas, disfraces y juguetes a precio de preventa.">
<meta name="theme-color" content="#6E0D3A">

<meta property="og:type" content="website">
<meta property="og:title" content="Almacén Hawaii — Preventa de Septiembre 2026">
<meta property="og:description" content="Nuevo producto a precio de preventa. Reservas hasta el 5 de octubre, pedidos por WhatsApp.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,700..900,100,1&family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- ══ La marca en vectores ══
     El archivo original del logo no llegó, así que el hibisco va dibujado:
     cinco pétalos rizados, las nervaduras blancas y el estambre con sus
     anteras. Cuando aparezca el SVG verdadero se reemplaza este <symbol>
     y todo el catálogo se actualiza solo, porque todo uso es un <use>. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <symbol id="flor-completa" viewBox="-108 -122 216 216">
  <g transform="translate(0,20)">
   <g fill="currentColor">
     <path d="M0 0C-20 -16 -40 -30 -48 -48C-56 -66 -48 -86 -28 -90C-16 -92 -6 -85 -2 -76C2 -85 12 -92 24 -90C44 -86 52 -66 44 -48C36 -30 20 -16 0 0Z" transform="rotate(0)"/>
     <path d="M0 0C-20 -16 -40 -30 -48 -48C-56 -66 -48 -86 -28 -90C-16 -92 -6 -85 -2 -76C2 -85 12 -92 24 -90C44 -86 52 -66 44 -48C36 -30 20 -16 0 0Z" transform="rotate(72)"/>
     <path d="M0 0C-20 -16 -40 -30 -48 -48C-56 -66 -48 -86 -28 -90C-16 -92 -6 -85 -2 -76C2 -85 12 -92 24 -90C44 -86 52 -66 44 -48C36 -30 20 -16 0 0Z" transform="rotate(144)"/>
     <path d="M0 0C-20 -16 -40 -30 -48 -48C-56 -66 -48 -86 -28 -90C-16 -92 -6 -85 -2 -76C2 -85 12 -92 24 -90C44 -86 52 -66 44 -48C36 -30 20 -16 0 0Z" transform="rotate(216)"/>
     <path d="M0 0C-20 -16 -40 -30 -48 -48C-56 -66 -48 -86 -28 -90C-16 -92 -6 -85 -2 -76C2 -85 12 -92 24 -90C44 -86 52 -66 44 -48C36 -30 20 -16 0 0Z" transform="rotate(288)"/>
   </g>
   <g fill="none" stroke="var(--papel)" stroke-width="3.4" stroke-linecap="round" opacity=".9">
     <path d="M0 -12C-3 -28 -9 -40 -18 -52 M0 -12C-1 -30 -1 -44 -2 -60 M0 -12C4 -28 10 -40 19 -51" transform="rotate(0)"/>
     <path d="M0 -12C-3 -28 -9 -40 -18 -52 M0 -12C-1 -30 -1 -44 -2 -60 M0 -12C4 -28 10 -40 19 -51" transform="rotate(72)"/>
     <path d="M0 -12C-3 -28 -9 -40 -18 -52 M0 -12C-1 -30 -1 -44 -2 -60 M0 -12C4 -28 10 -40 19 -51" transform="rotate(144)"/>
     <path d="M0 -12C-3 -28 -9 -40 -18 -52 M0 -12C-1 -30 -1 -44 -2 -60 M0 -12C4 -28 10 -40 19 -51" transform="rotate(216)"/>
     <path d="M0 -12C-3 -28 -9 -40 -18 -52 M0 -12C-1 -30 -1 -44 -2 -60 M0 -12C4 -28 10 -40 19 -51" transform="rotate(288)"/>
   </g>
   <g fill="currentColor" stroke="currentColor" stroke-linecap="round">
    <path d="M4 2C30 -20 54 -48 70 -78" fill="none" stroke-width="6"/>
    <circle cx="72" cy="-86" r="8"/><circle cx="55" cy="-82" r="6.5"/>
    <circle cx="88" cy="-78" r="6.5"/><circle cx="64" cy="-98" r="7"/>
    <circle cx="83" cy="-95" r="6"/><circle cx="49" cy="-96" r="5.5"/>
    <circle cx="75" cy="-108" r="5.5"/>
   </g>
  </g>
 </symbol>
</svg>

<header class="barra">
  <div class="barra-izq">
    <button class="btn-icono" id="abrir-indice" aria-label="Ver las categorías" title="Categorías">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="marca" href="#" data-ir="0" aria-label="Portada del catálogo">
      <span class="marca-txt">
        <b>Almacén Hawaii</b>
        <small>Preventa de Septiembre 2026</small>
      </span>
    </a>
  </div>

  <nav class="barra-acciones">
    <button class="btn-icono" id="abrir-carrito" aria-label="Ver mi pedido" title="Mi pedido">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      <span class="globo" id="contador" hidden>0</span>
    </button>
  </nav>
</header>

<main class="escenario">
  <button class="paso paso-izq" id="anterior" aria-label="Página anterior">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
  </button>

  <div class="libro-caja">
    <div id="libro" class="libro"></div>
    <div class="cargando" id="cargando"><span></span> Armando el catálogo…</div>
  </div>

  <button class="paso paso-der" id="siguiente" aria-label="Página siguiente">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg>
  </button>

  <div class="pie">
    <div class="regleta" id="regleta" role="progressbar" aria-label="Avance del catálogo"><i></i></div>
    <span class="folio" id="folio">1 / 1</span>
  </div>
</main>

<!-- ══ Ficha del producto ══ -->
<div class="telon" id="telon-ficha" hidden>
  <article class="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-nombre">
    <button class="cerrar" data-cerrar="ficha" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <div class="ficha-foto">
      <img id="ficha-img" alt="" width="700" height="700">
      <span class="sello" id="ficha-sello">-0%</span>
    </div>
    <div class="ficha-datos">
      <p class="ficha-sku" id="ficha-sku"></p>
      <h2 id="ficha-nombre"></h2>
      <p class="ficha-desc" id="ficha-desc"></p>
      <dl class="ficha-specs" id="ficha-specs"></dl>

      <div class="precios">
        <span class="regular" id="ficha-regular"></span>
        <span class="preventa" id="ficha-preventa"></span>
        <span class="etiqueta-ahorro" id="ficha-ahorro"></span>
      </div>

      <div class="campo" id="campo-color">
        <label>Color <span class="elegido" id="color-elegido"></span></label>
        <div class="muestras" id="ficha-colores" role="radiogroup" aria-label="Color"></div>
      </div>

      <div class="ficha-fila">
        <div class="campo campo-cant">
          <label for="ficha-cantidad">Cantidad</label>
          <div class="contador-cant">
            <button type="button" data-cant="-1" aria-label="Quitar uno">−</button>
            <input id="ficha-cantidad" type="number" value="1" min="1" max="99" inputmode="numeric">
            <button type="button" data-cant="1" aria-label="Agregar uno">+</button>
          </div>
        </div>
        <button class="btn-primario" id="agregar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          Agregar al pedido
        </button>
      </div>
    </div>
  </article>
</div>

<!-- ══ El pedido ══ -->
<div class="telon" id="telon-carrito" hidden>
  <aside class="carrito" role="dialog" aria-modal="true" aria-labelledby="carrito-titulo">
    <header>
      <h2 id="carrito-titulo">Mi pedido</h2>
      <button class="cerrar" data-cerrar="carrito" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <div class="carrito-cuerpo" id="carrito-cuerpo"></div>

    <footer class="carrito-pie" id="carrito-pie">
      <dl class="totales">
        <div><dt>Precio regular</dt><dd id="total-regular"></dd></div>
        <div class="ahorra"><dt>Ahorrás</dt><dd id="total-ahorro"></dd></div>
        <div class="grande"><dt>Total preventa</dt><dd id="total-preventa"></dd></div>
      </dl>

      <div class="campo">
        <label for="cli-nombre">Tu nombre</label>
        <input id="cli-nombre" type="text" autocomplete="name" placeholder="Nombre y apellido">
      </div>
      <div class="campo">
        <label for="cli-tel">Tu teléfono</label>
        <input id="cli-tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="7777-7777">
      </div>
      <p class="aviso" id="aviso-carrito" hidden></p>

      <a class="btn-whatsapp" id="enviar" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.7 15L2 22l5.2-1.3A10 10 0 1 0 12 2Z"/><path d="M8.5 7.8c.2-.5.4-.5.7-.5h.6c.2 0 .4 0 .6.5l.8 1.9c.1.3 0 .5-.1.7l-.5.6c-.2.2-.3.4-.1.7a7 7 0 0 0 3.3 2.9c.3.1.5 0 .7-.2l.6-.7c.2-.2.4-.2.6-.1l1.9.9c.3.1.4.3.4.5 0 .9-.6 1.8-1.4 2-.7.2-1.6.3-4.4-1a10 10 0 0 1-4-4.3c-.5-1.1-.8-2.4-.6-3.1.1-.5.4-1 .9-1.3Z"/></svg>
        Finalizar pedido por WhatsApp
      </a>
      <p class="nota-preventa">Se abre WhatsApp con el pedido escrito. Vos lo revisás y lo enviás.</p>
    </footer>
  </aside>
</div>

<!-- ══ Secciones ══ -->
<div class="telon" id="telon-indice" hidden>
  <nav class="indice" role="dialog" aria-modal="true" aria-labelledby="indice-titulo">
    <header>
      <h2 id="indice-titulo">Categorías</h2>
      <button class="cerrar" data-cerrar="indice" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <ol id="indice-lista"></ol>
  </nav>
</div>

<div class="brindis" id="brindis" hidden></div>

<script src="vendor/page-flip.browser.js"></script>
<script src="datos.js"></script>
<script src="guion.js"></script>
</body>
</html>
